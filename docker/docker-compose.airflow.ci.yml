# Temporary Airflow services for GitHub Actions
x-airflow-common: &airflow-common
  image: db-delay-airflow:ci
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db:5432/airflow
    PIPELINE_SCHEDULE: "none"
  volumes:
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-metadata-db:
      condition: service_healthy

services:
  airflow-metadata-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-metadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: airflow db migrate

  airflow-scheduler:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      DATABASE_URL: ${DATABASE_URL:-}
      DB_CLIENT_ID: ${DB_CLIENT_ID:-}
      DB_API_KEY: ${DB_API_KEY:-}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

volumes:
  airflow-metadata-db-data:
  airflow-logs:
