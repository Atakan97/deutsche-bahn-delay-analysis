# Local development stack
# For the full pipeline with Airflow, use docker-compose.airflow.yml instead
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: deutsche_bahn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Keep database data for container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI service
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
