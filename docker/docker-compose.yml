# Local development stack
services:
  # Local PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: deutsche_bahn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Keep database data for container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Pipeline (extract from DB API + dbt transform)
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deutsche_bahn
      DB_CLIENT_ID: ${DB_CLIENT_ID}
      DB_API_KEY: ${DB_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # FastAPI delay prediction service
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "7860:7860"
    restart: unless-stopped

volumes:
  postgres_data:
