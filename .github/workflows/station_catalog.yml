name: Station Catalogue Sync

on:
  schedule:
    # StaDa serves static master data and allows one daily use per API key
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sync-stations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Sync official station catalogue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: python -m data_pipeline.extract.seed_stations
