name: ELT Pipeline (Airflow)

on:
  workflow_dispatch:
  # Add a schedule after the first manual run succeeds
  # schedule:
  #   - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: production-elt-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker/docker-compose.airflow.ci.yml
      COMPOSE_PROJECT_NAME: db-delay-elt
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
      DB_API_KEY: ${{ secrets.DB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          for variable in DATABASE_URL DB_CLIENT_ID DB_API_KEY; do
            if [ -z "${!variable}" ]; then
              echo "Missing secret: $variable"
              exit 1
            fi
          done

      - name: Build Airflow image
        run: docker compose build airflow-scheduler

      - name: Start Airflow scheduler
        run: docker compose up -d --wait --wait-timeout 180 airflow-scheduler

      - name: Trigger the ELT DAG and wait for its result
        run: |
          docker compose exec -T airflow-scheduler \
            python -m data_pipeline.orchestration.run_dag \
            --run-id "github__${GITHUB_RUN_ID}__${GITHUB_RUN_ATTEMPT}" \
            --timeout 600

      - name: Collect Airflow logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/airflow-logs"
          docker compose logs --no-color > "$RUNNER_TEMP/airflow-logs/services.log" 2>&1
          if [ -n "$(docker compose ps -q airflow-scheduler)" ]; then
            docker compose cp airflow-scheduler:/opt/airflow/logs "$RUNNER_TEMP/airflow-logs/tasks"
          fi

      - name: Upload Airflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airflow-logs
          retention-days: 7

      - name: Stop Airflow and remove temporary volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
