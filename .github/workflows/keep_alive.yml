# Prevents Hugging Face Spaces from sleeping
name: Keep Alive

on:
  schedule:
    # Every 6 hours at minute 0
    - cron: "0 */6 * * *"

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging ${{ secrets.HF_SPACE_URL }}/health ..."
          curl -sf "${{ secrets.HF_SPACE_URL }}/health" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10 \
            || echo "Warning: Health check failed (container may be cold-starting)."
          echo "Done."
