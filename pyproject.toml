[project]
name = "deutsche-bahn-delay-analysis"
version = "0.1.0"
description = "End-to-end data platform for Deutsche Bahn train delay analysis"
requires-python = ">=3.11"

# Pyright / Pylance
[tool.pyright]
extraPaths = ["dashboard"]

# Ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle errors/warnings, F = pyflakes, I = isort (import order)
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
